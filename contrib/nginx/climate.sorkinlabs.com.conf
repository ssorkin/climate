# climate.sorkinlabs.com — static SvelteKit site from github.com/ssorkin/climate
# Cert: certbot webroot (/var/www/letsencrypt). Install:
#   sudo cp contrib/nginx/climate.sorkinlabs.com.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/climate.sorkinlabs.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name climate.sorkinlabs.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://climate.sorkinlabs.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name climate.sorkinlabs.com;

    ssl_certificate     /etc/letsencrypt/live/climate.sorkinlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/climate.sorkinlabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/climate-current;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/octet-stream image/svg+xml;

    location /data/ { add_header Cache-Control "public, max-age=3600"; }
    location /_app/immutable/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
