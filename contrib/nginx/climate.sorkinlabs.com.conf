# climate.sorkinlabs.com — static SvelteKit site from github.com/ssorkin/climate
# Install: sudo cp contrib/nginx/climate.sorkinlabs.com.conf /etc/nginx/sites-available/ &&
#          sudo ln -s /etc/nginx/sites-available/climate.sorkinlabs.com.conf /etc/nginx/sites-enabled/ &&
#          sudo nginx -t && sudo systemctl reload nginx
# Then, once DNS points here:
#          sudo certbot certonly --webroot -w /var/www/letsencrypt -d climate.sorkinlabs.com
# and uncomment the https server block below (or let `certbot --nginx` add it).

server {
    listen 80;
    listen [::]:80;
    server_name climate.sorkinlabs.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Until the certificate exists this block serves the site over http;
    # replace with `location / { return 301 https://climate.sorkinlabs.com$request_uri; }`
    # after certbot succeeds.
    root /var/www/climate-current;
    index index.html;
    gzip_static on;
    location /data/ { add_header Cache-Control "public, max-age=3600"; }
    location /_app/immutable/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri.html $uri/ =404; }
}

