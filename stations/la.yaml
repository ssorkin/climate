# Greater Los Angeles stations with 50+ complete years of daily TMAX/TMIN in NOAA
# GHCN-Daily — still-reporting stations and closed ones alike (a closed station's
# record is still a record). Selection rule: >= 50 complete years (>= 90% of days
# observed) and, for the "then vs now" comparisons, coverage of the 1951-1980
# baseline. Names, coordinates and elevation come from ghcnd-stations.txt at
# ingest time; `short` is only the display label.
region: la
name: Greater Los Angeles
center: [34.08, -118.05]
zoom: 7.85
default_station: USC00046719
stations:
  # --- still reporting ---
  - id: USC00046719
    short: Pasadena
    ushcn: true
    # NOAA station history (HOMR, COOP 046719): lawn site near City Hall.
    notable:
