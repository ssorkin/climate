[project]
name = "climate"
version = "0.1.0"
description = "Long-term NOAA climate records for the Los Angeles area, made explorable"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stephen Sorkin", email = "ssorkin@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.43",
    "pyarrow>=18",
    "numpy>=2",
    "scipy>=1.14",
    "httpx>=0.28",
    "pyyaml>=6",
    "typer>=0.15",
    "rich>=13",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
clim = "climate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
